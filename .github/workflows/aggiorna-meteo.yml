name: Aggiorna Temperatura Meteo

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Controlla il repository
      uses: actions/checkout@v4

    - name: Configura Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Estrai i dati dal sito meteo
      run: |
        node -e "
        const fs = require('fs');
        fetch('https://meteoregionelazio.it/rete/stazione.php?id=AQ-039')
          .then(res => res.text())
          .then(html => {
            // Cerchiamo la parola 'Attuale' e catturiamo il primo valore in grassetto successivo con il simbolo °C
            const regex = /Attuale[\s\S]*?<strong>\s*([\d.,-]+(?:\s*°C)?)\s*<\/strong>/i;
            const match = html.match(regex);
            
            let temp = 'N/D';
            if (match && match[1]) {
              temp = match[1].trim();
              if (!temp.includes('°C')) temp += '°C';
            } else {
              // Secondo tentativo se la struttura della tabella varia leggermente
              const fallbackRegex = /<strong>([\d.,-]+)\s*°C<\/strong>/i;
              const fallbackMatch = html.match(fallbackRegex);
              if (fallbackMatch && fallbackMatch[1]) {
                temp = fallbackMatch[1].trim() + '°C';
              }
            }
            
            const dati = { 
              temperatura: temp, 
              aggiornato: new Date().toISOString() 
            };
            fs.writeFileSync('temperatura.json', JSON.stringify(dati, null, 2));
            console.log('Dati salvati:', dati);
          });
        "

    - name: Salva il file aggiornato nel repository
      run: |
        git config --global user.name 'MeteoBot'
        git config --global user.email 'bot@github.com'
        git add temperatura.json
        git commit -m "Aggiornamento automatico temperatura" || exit 0
        git push
