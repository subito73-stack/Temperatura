name: Aggiorna Temperatura Meteo

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Estrai i dati e invia a JSONBin
      run: |
        node -e "
        fetch('https://meteoregionelazio.it')
          .then(res => res.text())
          .then(html => {
            const regex = /Attuale[\s\S]*?<strong>\s*([\d.,-]+(?:\s*°C)?)\s*<\/strong>/i;
            const match = html.match(regex);
            let temp = '4.6°C';
            if (match && match) temp = match[1].trim();
            if (!temp.includes('°C')) temp += '°C';

            const dati = { temperatura: temp, aggiornato: new Date().toISOString() };

            const binId = '6aecbfc2ac6210605a6ff3bd';
            const apiKey = '$2a$10$9yX9N0AhoZ24JBiMQ.kOxe2qMAaCH5Ns4SHzB3Hx.hbDRRWP2Sffq';

            fetch('https://jsonbin.io' + binId, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': apiKey
              },
              body: JSON.stringify(dati)
            }).then(() => console.log('Sincronizzazione completata.'));
          });
        "
